# Golden Q&A pairs for comparison queries against NVDA 10-K FY2024.
# Each question requires explicitly contrasting two values — across segments or years.

- query: "How did NVDA's Compute & Networking and Graphics segment revenues compare in fiscal year 2024?"
  query_type: comparison
  answer: >
    In fiscal year 2024, the Compute & Networking segment generated $47,405 million
    in revenue (up 215% from $15,068 million in fiscal year 2023), while the Graphics
    segment generated $13,517 million (up 14% from $11,906 million). Compute &
    Networking represented about 78% of total revenue and grew more than 15 times
    faster than Graphics.

- query: "How did NVDA's operating income growth rate compare to its revenue growth rate in fiscal year 2024?"
  query_type: comparison
  answer: >
    Revenue grew 126% to $60,922 million in fiscal year 2024, while operating income
    grew 681% to $32,972 million from $4,224 million in fiscal year 2023. Operating
    income grew more than five times faster than revenue, reflecting the strong
    operating leverage achieved as Data Center revenue scaled with only modest
    growth in operating expenses.

- query: "How did NVDA's operating cash flow compare between fiscal year 2023 and fiscal year 2024?"
  query_type: comparison
  answer: >
    Net cash provided by operating activities was $28,090 million in fiscal year 2024,
    compared to $5,641 million in fiscal year 2023, an increase of approximately
    $22,449 million. The improvement was driven by the significant growth in net
    income from $4,368 million to $29,760 million over the same period.
