# Golden Q&A pairs for single-hop queries against NVDA 10-K FY2024.
# query must match the exact string sent to the pipeline.
# answer is the expected factual response used by RAGAS for context_recall
# and answer_correctness evaluation.
# query_type is required for schema consistency and future routing validation.

- query: "What was NVDA Data Center revenue in fiscal year 2024?"
  query_type: single
  answer: >
    Data Center revenue for fiscal year 2024 was $47,525 million,
    up 217% from $15,005 million in fiscal year 2023.

- query: "Why did NVDA's gross margin improve in fiscal year 2024?"
  query_type: single
  answer: >
    Gross margin increased in fiscal year 2024, primarily driven by Data Center
    revenue growth and lower net inventory provisions as a percentage of revenue.
    Gross margin expanded 15.8 percentage points to 72.7% from 56.9% in fiscal
    year 2023.

- query: "Who manufactures NVDA's semiconductor wafers?"
  query_type: single
  answer: >
    NVDA relies on Taiwan Semiconductor Manufacturing Company (TSMC) and Samsung
    Electronics to produce its semiconductor wafers. NVDA also utilizes CoWoS
    technology for semiconductor packaging.

- query: "What US government export restrictions affected NVDA product sales in fiscal year 2024?"
  query_type: single
  answer: >
    The US government imposed licensing requirements restricting exports of NVDA
    products including A100, A800, H100, H800, L4, L40, L40S, and RTX 4090 to
    China and certain other regions. As a result, China represented only a
    mid-single digit percentage of Data Center revenue in the fourth quarter of
    fiscal year 2024.

- query: "How much cash and marketable securities did NVDA hold at the end of fiscal year 2024?"
  query_type: single
  answer: >
    At the end of fiscal year 2024, NVDA held $25,984 million in cash, cash
    equivalents, and marketable securities, comprising $7,280 million in cash
    and cash equivalents and $18,704 million in marketable securities.

- query: "What share repurchase activity did NVDA complete during fiscal year 2024?"
  query_type: single
  answer: >
    During fiscal year 2024, NVDA repurchased 21 million shares of common stock
    for $9.7 billion. In August 2023, the Board approved an additional $25.0
    billion share repurchase authorization without expiration. As of January 28,
    2024, $22.5 billion of repurchase authorization remained.

- query: "What drove growth in NVDA Automotive revenue in fiscal year 2024?"
  query_type: single
  answer: >
    Automotive revenue for fiscal year 2024 was $1,091 million, up 21% from
    $903 million in fiscal year 2023. The increase primarily reflected growth
    in self-driving platforms.
