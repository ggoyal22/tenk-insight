      ticker: AMD
      form_type: 10-K
      fiscal_year: '2025'
      section: '7'
      query: AMD ZT Systems acquisition fiscal year 2025 deal terms cash shares
  - filter:
      ticker: NVDA
      form_type: 10-K
      fiscal_year: '2025'
      section: '8'
      query: NVIDIA acquisitions completed fiscal year 2025 Arm termination goodwill
  answer: |
    AMD's fiscal year 2025 annual report disclosed a specific major acquisition with detailed terms: in March 2025 AMD completed the acquisition of ZT Systems for $3.2 billion in cash and 8.3 million shares of its common stock, retaining the ZT Design Business, and in October 2025 it sold the ZT data center infrastructure manufacturing business to Sanmina for $2.4 billion in cash plus 1.2 million Sanmina shares. NVIDIA's fiscal year 2025 annual report disclosed no comparable completed business acquisition of that scale; its acquisition-related disclosure instead centered on the earlier February 2022 termination of the Arm Share Purchase Agreement due to regulatory challenges, and its goodwill rose only modestly to $5.2 billion as of January 26, 2025 from $4.4 billion a year earlier.
- query: How did Boeing's fiscal year 2025 annual report and ExxonMobil's fiscal year 2025
    annual report differ in disclosing a specific product-safety event and resulting regulatory
    production constraint?
  query_type: comparison
  difficulty: hard
  expected_tasks:
  - filter:
      ticker: BA
      form_type: 10-K
      fiscal_year: '2025'
      section: 1A
      query: Boeing 737-9 door plug accident FAA production rate constraint fiscal year 2025
  - filter:
      ticker: XOM
      form_type: 10-K
      fiscal_year: '2025'
      section: 1A
      query: ExxonMobil regulatory and operational risk disclosure fiscal year 2025
  answer: |
    Boeing's fiscal year 2025 annual report disclosed a specific product-safety event and a resulting regulatory production constraint: following the 737-9 door plug accident in January 2024, the FAA investigated the 737 quality control system (including Spirit AeroSystems) and increased oversight, and the 737 program may only increase production rates and/or implement new production lines with the concurrence of the FAA. Boeing stated it slowed 737 production rates and delayed planned rate increases to reduce traveled work. ExxonMobil's fiscal year 2025 annual report did not disclose any such company-specific product-safety accident or a regulator-imposed cap on its output; instead it framed regulatory and technology matters as general industry and policy risks (for example, around emissions, lower-emission technologies such as carbon capture and storage, and shifting policy stringency).
