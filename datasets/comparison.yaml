- query: What were ExxonMobil's earnings per common share and dividends paid per common share
    in fiscal year 2024 and fiscal year 2025?
  query_type: comparison
  difficulty: medium
  answer: |
    In fiscal year 2024, ExxonMobil's earnings per common share were $7.84 and dividends paid per common share were $3.84. In fiscal year 2025, earnings per common share were $6.70 and dividends paid per common share were $4.00.
- query: What was ExxonMobil's total worldwide oil-equivalent production in thousands of oil-equivalent
    barrels daily in fiscal year 2024 and fiscal year 2025?
  query_type: comparison
  difficulty: medium
  answer: |
    ExxonMobil's total worldwide oil-equivalent production was 4,333 thousand oil-equivalent barrels daily in fiscal year 2024 and 4,736 thousand oil-equivalent barrels daily in fiscal year 2025.
- query: What were ExxonMobil's and Pfizer's net income attributable to each company's common
    shareholders and earnings per common share in fiscal year 2025?
  query_type: comparison
  difficulty: medium
  answer: |
    ExxonMobil's net income attributable to ExxonMobil was $28,844 million in fiscal year 2025, with earnings per common share of $6.70. Pfizer's net income attributable to Pfizer Inc. common shareholders was $7,771 million in fiscal year 2025, with net income per common share of $1.36.
- query: What goodwill balances did NVIDIA and AMD each carry on their balance sheets at the
    end of their respective fiscal years 2024?
  query_type: comparison
  difficulty: medium
  answer: |
    At the end of NVIDIA's fiscal year 2024 (January 28, 2024), NVIDIA's goodwill was $4,430 million. At the end of AMD's fiscal year 2024 (December 28, 2024), AMD's goodwill was $24,839 million.
- query: How did Apple's effective tax rate for fiscal year 2025 compare to Microsoft's effective
    tax rate for fiscal year 2025?
  query_type: comparison
  difficulty: medium
  answer: |
    Apple's effective tax rate for fiscal year 2025 was 15.6%, down from 24.1% in fiscal year 2024 (the prior-year rate was elevated by the State Aid Decision). Microsoft's effective tax rate for fiscal year 2025 was 18%, the same as fiscal year 2024. Microsoft's rate was therefore higher than Apple's in fiscal year 2025.
- query: What were Microsoft's and Pfizer's total research and development expenses in fiscal
    year 2025, and how did each company's R&D expense change from the prior fiscal year?
  query_type: comparison
  difficulty: medium
  answer: |
    Microsoft's research and development expenses were $32,488 million in fiscal year 2025, up from $29,510 million in fiscal year 2024, an increase of $3.0 billion or 10% driven by investments in cloud and AI engineering and Gaming, including the impact of the Activision Blizzard acquisition. Pfizer's research and development expenses were $10,437 million in 2025, down from $10,822 million in 2024, a decrease of $385 million primarily driven by a net decrease in spending from pipeline focus and optimization initiatives and lower compensation-related expenses.
- query: During fiscal year 2025, how many shares of common stock did Apple and Microsoft
    each repurchase, and how much cash did each company spend on those repurchases?
  query_type: comparison
  difficulty: medium
  answer: |
    During fiscal year 2025, Apple repurchased 402 million shares of its common stock for $89.3 billion. During fiscal year 2025, Microsoft repurchased 31 million shares of its common stock for $13.0 billion (compared with 32 million shares for $12.0 billion in fiscal year 2024).
- query: How did NVIDIA's total revenue for fiscal year 2025 compare to ExxonMobil's sales
    and other operating revenue for fiscal year 2025?
  query_type: comparison
  difficulty: medium
  answer: |
    NVIDIA's total revenue for fiscal year 2025 was $130,497 million, up 114% from $60,922 million in fiscal year 2024. ExxonMobil's sales and other operating revenue for fiscal year 2025 was $323,905 million (down from $339,247 million in 2024). ExxonMobil's revenue base was roughly 2.5 times NVIDIA's, though NVIDIA's was growing far faster.
- query: How did Apple's total net sales trend from fiscal year 2024 to fiscal year 2025 compare
    with ExxonMobil's total revenues and other income over the same period?
  query_type: comparison
  difficulty: medium
  answer: |
    Apple's total net sales rose from $391,035 million in fiscal year 2024 to $416,161 million in fiscal year 2025, an increase. ExxonMobil's total revenues and other income fell from $349,585 million in fiscal year 2024 to $332,238 million in fiscal year 2025, a decrease. The two companies moved in opposite directions: Apple's revenue grew while ExxonMobil's declined.
- query: What were ExxonMobil's cumulative structural cost savings relative to 2019 as reported
    in its fiscal year 2024 and fiscal year 2025 annual reports, and how much did the company
    add in fiscal year 2025 alone?
  query_type: comparison
  difficulty: hard
  answer: |
    As reported in its fiscal year 2024 annual report, ExxonMobil's estimated cumulative structural cost savings relative to 2019 totaled $12.1 billion. As reported in its fiscal year 2025 annual report, cumulative structural cost savings totaled $15.1 billion, which included an additional $3.0 billion added in 2025.
- query: How many total employees did NVIDIA have at the end of fiscal year 2024 versus fiscal
    year 2025, and how was each workforce split between research and development and other
    functions?
  query_type: comparison
  difficulty: hard
  answer: |
    At the end of fiscal year 2024, NVIDIA had approximately 29,600 employees; 22,200 were engaged in research and development and 7,400 were engaged in sales, marketing, operations, and administrative positions. At the end of fiscal year 2025, NVIDIA had approximately 36,000 employees; 27,100 were engaged in research and development and 8,900 were engaged in sales, marketing, operations, and administrative positions.
- query: How did AMD's research and development expenses change from fiscal year 2024 to fiscal
    year 2025 in dollar terms, and what primary factor drove the increase in each year?
  query_type: comparison
  difficulty: hard
  answer: |
    AMD's research and development expenses were $6.5 billion in fiscal year 2024, an increase of $584 million, or 10%, from $5.9 billion in 2023, primarily due to higher employee-related costs from an increase in headcount in support of AMD's AI strategy. In fiscal year 2025, research and development expenses were $8.1 billion, an increase of $1.6 billion, or 25%, from $6.5 billion in 2024, also primarily due to higher employee-related costs from an increase in headcount in support of AMD's continued focus on its AI strategy.
- query: How many shares did NVIDIA and AMD each repurchase during their respective fiscal
    years 2025, how much capital did each deploy, and what was each company's remaining buyback
    authorization at fiscal year-end?
  query_type: comparison
  difficulty: hard
  answer: |
    During NVIDIA's fiscal year 2025, NVIDIA repurchased 310 million shares of its common stock for $34.0 billion; as of January 26, 2025, NVIDIA was authorized to repurchase up to $38.7 billion of additional common stock. During AMD's fiscal year 2025, AMD repurchased 12.4 million shares of common stock for $1.3 billion; as of December 27, 2025, $9.4 billion remained available for future stock repurchases under AMD's program.
- query: How did NVIDIA's fiscal year 2024 annual report and AMD's fiscal year 2024 annual
    report differ in their disclosure of specific products subject to U.S. government export
    licensing requirements for China and other restricted destinations?
  query_type: comparison
  difficulty: hard
  answer: |
    NVIDIA's fiscal year 2024 annual report disclosed specific products subject to U.S. government export licensing requirements, including A100 and H100 integrated circuits and DGX systems incorporating those chips (impacted from the third quarter of fiscal year 2023), and, effective in the fourth quarter of fiscal year 2024, A800, H800, L4, L40, L40S, and RTX 4090 for exports to China and Country Groups D1, D4, and D5 (including Saudi Arabia, the United Arab Emirates, and Vietnam, but excluding Israel). AMD's fiscal year 2024 annual report likewise named affected products, stating that export controls prevented it from shipping certain AMD Instinct integrated circuits and certain AMD Versal FPGAs to China and the same Country Groups D1, D4, and D5, and additionally noted that the Bureau of Industry and Security had added AMD's THATIC joint venture partners to the Entity List in June 2019. The two reports therefore differ in granularity rather than disclosure: NVIDIA enumerated individual chip models, while AMD identified affected product families.
- query: What total revenue did NVIDIA, Apple, and Microsoft each report for fiscal year 2025?
  query_type: comparison
  difficulty: hard
  answer: |
    For fiscal year 2025, NVIDIA reported total revenue of $130,497 million, Apple reported total net sales of $416,161 million, and Microsoft reported total revenue of $281,724 million. Apple had the largest top line of the three, followed by Microsoft and then NVIDIA.
- query: How did ExxonMobil's fiscal year 2025 annual report and Pfizer's fiscal year 2025
    annual report differ in disclosing specific greenhouse gas emission-reduction targets
    and timelines?
  query_type: comparison
  difficulty: hard
  answer: |
    ExxonMobil's fiscal year 2025 annual report disclosed specific, dated emission goals: it described 2030 emission-intensity reduction plans incorporated into its medium-term business plans, and a plan to reach net-zero Scope 1 and 2 emissions in its integrated Permian Basin operated assets by 2035, including the Pioneer assets acquired in 2024. ExxonMobil also noted that current policy and technology trends are not yet on a pathway to achieve net-zero by 2050. Pfizer's fiscal year 2025 annual report also set out specific targets, committing to the Science Based Targets initiative's voluntary Net-Zero Standard by 2040 and aiming to decrease its GHG emissions by 95% and its value chain emissions by 90% from 2019 levels by 2040. The two reports therefore differ in scope and framing rather than in whether targets were disclosed: ExxonMobil emphasizes emission-intensity reductions and an operational Permian net-zero milestone by 2035, while Pfizer targets deep absolute and value-chain reductions toward enterprise net-zero by 2040.
- query: How did Boeing's fiscal year 2025 annual report and ExxonMobil's fiscal year 2025
    annual report differ in disclosing a specific product-safety event and resulting regulatory
    production constraint?
  query_type: comparison
  difficulty: hard
  answer: |
    Boeing's fiscal year 2025 annual report disclosed a specific product-safety event and a resulting regulatory production constraint: following the 737-9 door plug accident in January 2024, the FAA investigated the 737 quality control system (including Spirit AeroSystems) and increased oversight, and the 737 program may only increase production rates and/or implement new production lines with the concurrence of the FAA. Boeing stated it slowed 737 production rates and delayed planned rate increases to reduce traveled work. ExxonMobil's fiscal year 2025 annual report did not disclose any such company-specific product-safety accident or a regulator-imposed cap on its output; instead it framed regulatory and technology matters as general industry and policy risks (for example, around emissions, lower-emission technologies such as carbon capture and storage, and shifting policy stringency).
- query: What was NVIDIA's gross margin in fiscal year 2025, and how did it compare to fiscal
    year 2024?
  query_type: comparison
  difficulty: medium
  answer: |
    NVIDIA's gross margin was 75.0% in fiscal year 2025, up from 72.7% in fiscal year 2024. The year-over-year increase was primarily driven by a higher mix of Data Center revenue.
- query: What was the operating income for NVIDIA's Compute & Networking segment in fiscal
    year 2024, and how did it compare to fiscal year 2023?
  query_type: comparison
  difficulty: medium
  answer: |
    NVIDIA's Compute & Networking segment operating income was $32,016 million in fiscal year 2024, up 530% from $5,083 million in fiscal year 2023.
- query: What was Boeing's gain on dispositions, net, in 2025, and how did it compare to 2024?
  query_type: comparison
  difficulty: medium
  answer: |
    Boeing's gain on dispositions, net was $9,672 million in 2025, compared to $46 million in 2024.
- query: What was Boeing Commercial Airplanes' total backlog at December 31, 2025, and how
    did it change from December 31, 2024?
  query_type: comparison
  difficulty: medium
  answer: |
    BCA's total backlog was $567,290 million at December 31, 2025, up from $435,175 million at December 31, 2024, reflecting new orders in excess of deliveries. Aircraft order cancellations during 2025 totaled $11,094 million, primarily related to 777X, 737, and 787 aircraft.
- query: What royalty income did AMD recognize from the THATIC joint venture in 2024 and 2023,
    and what is the basis for these royalties?
  query_type: comparison
  difficulty: medium
  answer: |
    AMD recognized $48 million in royalty income from the THATIC joint venture in 2024 and $34 million in 2023. These royalties are based on sales of the THATIC JV's products developed using intellectual property that AMD licensed to the joint venture in February 2016.
- query: What was ExxonMobil's regular employee count at year-end 2025, 2024, and 2023?
  query_type: comparison
  difficulty: medium
  answer: |
    ExxonMobil's regular employee count was 58 thousand at year-end 2025, 61 thousand at year-end 2024, and 62 thousand at year-end 2023.
- query: What were AMD's Client segment net revenue, unit shipment growth, average selling
    price change, and operating income in 2024 compared to 2023?
  query_type: comparison
  difficulty: hard
  answer: |
    AMD's Client segment net revenue was $7.1 billion in 2024, up 52% from $4.7 billion in 2023, primarily due to a 34% increase in unit shipments and a 13% increase in average selling price driven by strong demand for AMD mobile and desktop Ryzen processors. Client operating income was $897 million in 2024, compared to an operating loss of $46 million in 2023.
- query: What were the primary drivers of the increase in revenue for each of Boeing's three
    reportable segments in fiscal year 2025 compared to fiscal year 2024, and what was the
    total revenue increase across all segments?
  query_type: comparison
  difficulty: hard
  answer: |
    Boeing's total revenues increased by $22,946 million in fiscal year 2025 compared with 2024. BCA revenues increased by $18,633 million, primarily due to higher deliveries. BDS revenues increased by $3,316 million, primarily due to lower net unfavorable cumulative contract catch-up adjustments and higher volume. BGS revenues increased by $969 million, primarily due to higher government and commercial services revenue.
