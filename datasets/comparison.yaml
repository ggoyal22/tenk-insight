- query: How did ExxonMobil's fiscal year 2025 annual report and Pfizer's fiscal year 2025
    annual report differ in disclosing specific greenhouse gas emission-reduction targets
    and timelines?
  query_type: comparison
  difficulty: hard
  expected_tasks:
  - filter:
      ticker: XOM
      form_type: 10-K
      fiscal_year: '2025'
      section: 1A
      query: ExxonMobil net zero greenhouse gas emission reduction targets Permian 2035 Pioneer
        fiscal year 2025
  - filter:
      ticker: PFE
      form_type: 10-K
      fiscal_year: '2025'
      section: 1A
      query: Pfizer environmental greenhouse gas emissions net zero disclosure fiscal year
        2025
  answer: |
    ExxonMobil's fiscal year 2025 annual report disclosed specific, dated emission goals: it described 2030 emission-intensity reduction plans incorporated into its medium-term business plans, and a plan to reach net-zero Scope 1 and 2 emissions in its integrated Permian Basin operated assets by 2035, including the Pioneer assets acquired in 2024. ExxonMobil also noted that current policy and technology trends are not yet on a pathway to achieve net-zero by 2050. Pfizer's fiscal year 2025 annual report did not set out comparable company-specific emission-reduction targets or timelines; instead it discussed environmental stewardship in general terms within its broader discussion of differing stakeholder views on responsible business practices, without specific net-zero dates analogous to ExxonMobil's.
