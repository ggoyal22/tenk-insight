      fiscal_year: '2025'
      section: '1'
      query: How many full-time employees did Microsoft employ as of June 30, 2025 and what
        was the breakdown by business function?
  answer: |
    As of June 30, 2025, Microsoft employed approximately 228,000 people on a full-time basis, with 125,000 in the U.S. and 103,000 internationally. Of the total, 89,000 were in operations, 80,000 in product research and development, 44,000 in sales and marketing, and 15,000 in general and administration.
- query: What cybersecurity incident involving a nation-state threat actor did Microsoft describe
    in its fiscal year 2025 annual report, and what did the threat actor gain access to?
  query_type: single
  difficulty: medium
  expected_tasks:
  - filter:
      ticker: MSFT
      form_type: 10-K
      fiscal_year: '2025'
      section: 1A
      query: What nation-state cybersecurity incident does Microsoft disclose in its fiscal
        year 2025 10-K, including the attack method and systems accessed?
  answer: |
    Beginning in late November 2023, a nation-state associated threat actor used a password spray attack to compromise a legacy test account and gain access to Microsoft email accounts. The threat actor used information obtained to gain unauthorized access to some of Microsoft's source code repositories and internal systems.
- query: What IP litigation risk related to emerging technologies did Apple identify in its
