      fiscal_year: '2025'
      section: 1A
      query: What does Apple disclose about patent infringement litigation risk in fiscal
        year 2025, including risks related to AI and machine learning and the geographic scope
        of active defense actions?
  answer: |
    Apple disclosed that risks of patent claims and novel IP claims may be exacerbated as new and emerging technologies, including machine learning and artificial intelligence, are further integrated into its products and services. The Company is vigorously defending infringement actions in courts in several U.S. jurisdictions as well as internationally in various countries.
