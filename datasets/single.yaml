      form_type: 10-K
      fiscal_year: '2025'
      section: '1'
      query: What strike or labor action did Boeing experience at its St. Louis area sites
        in 2025, how long did it last, and which programs were affected?
  answer: |
    In 2025, employees represented by IAM District 837, which represents approximately 3,200 employees at Boeing's St. Louis area sites, went on strike for 101 days. The strike disrupted Boeing's St. Louis operations and impacted programs including F/A-18, F-15, T-7A, MQ-25, and Weapons.
