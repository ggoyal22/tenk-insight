- query: What were AMD's Embedded segment net revenue and operating income in 2024, and what
    drove the year-over-year changes?
  query_type: single
  difficulty: medium
  expected_tasks:
  - filter:
      ticker: AMD
      form_type: 10-K
      fiscal_year: '2024'
      section: '7'
      query: What were AMD's Embedded segment net revenue and operating income in 2024 and
        what caused the changes from 2023?
  answer: |
    AMD's Embedded segment net revenue was $3.6 billion in 2024, down 33% from $5.3 billion in 2023, primarily due to lower demand as customers continued to normalize their inventory levels. Embedded operating income was $1.4 billion in 2024, compared to $2.6 billion in 2023, with the decrease primarily driven by lower revenue.
- query: What manufacturing dependency did AMD identify as a material risk for its microprocessor
    and GPU products in its 2024 annual report, and what was the term of AMD's wafer supply
    agreement with GlobalFoundries?
  query_type: single
  difficulty: medium
  expected_tasks:
  - filter:
      ticker: AMD
      form_type: 10-K
      fiscal_year: '2024'
      section: 1A
      query: What manufacturing risks does AMD disclose related to TSMC and third-party wafer
        fabrication for its GPU and microprocessor products?
  answer: |
    AMD identified dependence on TSMC for manufacturing wafers for its microprocessor and GPU products at 7nm or smaller nodes as a material risk; if TSMC cannot manufacture these products in sufficient quantities, it could have a material adverse effect on AMD's business. AMD was also party to a wafer supply agreement with GlobalFoundries under which GlobalFoundries would provide a minimum annual capacity allocation and set pricing through 2026.
