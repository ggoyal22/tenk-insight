      ticker: PFE
      form_type: 10-K
      fiscal_year: '2025'
      section: '7'
      query: What was Pfizer's acquired in-process R&D expense in 2025 and what in-licensing
        agreements caused the increase from 2024?
  answer: |
    Pfizer's acquired in-process research and development expense was $1,613 million in 2025, up from $108 million in 2024. The increase was primarily driven by a $1.35 billion charge related to an in-licensing agreement with 3SBio and a $150 million charge related to an in-licensing agreement with YaoPharma.
- query: What labor action affected Boeing's St. Louis area operations in 2025, and what was
