- query: What percentage of NVIDIA's total revenue did its largest direct customer and largest
    estimated indirect customer each represent in fiscal year 2024, and to which segment was
    each attributed?
  query_type: single
  difficulty: hard
  expected_tasks:
  - filter:
      ticker: NVDA
      form_type: 10-K
      fiscal_year: '2024'
      section: 1A
      query: What customer concentration risk does NVIDIA disclose for fiscal year 2024, including
        revenue percentages for its largest direct and indirect customers?
  answer: |
    NVIDIA's largest direct customer, referred to as Customer A, represented 13% of total revenue for fiscal year 2024, attributable to the Compute & Networking segment. One indirect customer, which primarily purchases through system integrators and distributors including through Customer A, is estimated to have represented approximately 19% of total revenue for fiscal year 2024, also attributable to the Compute & Networking segment.
- query: What R&D co-funding arrangement did Pfizer enter into with Abingworth in September
    2025, and what were the key financial terms including the 2025 impact and potential milestone
    payment?
  query_type: single
  difficulty: hard
  expected_tasks:
  - filter:
      ticker: PFE
      form_type: 10-K
      fiscal_year: '2025'
      section: '8'
      query: What were the terms of Pfizer's R&D funding arrangement with Abingworth entered
        in September 2025, including funding amount, R&D expense impact, and milestone payment
        obligations?
  answer: |
    In September 2025, Pfizer entered into an arrangement with Abingworth under which Pfizer would receive up to $200 million from 2025 through 2027 to co-fund quarterly development costs for specified programs. The arrangement reduced Pfizer's research and development expenses by $54 million in 2025. Upon potential regulatory approval in the U.S., Abingworth would be eligible to receive an approval-based fixed milestone payment of up to $120 million, payable over a period of approximately eighteen months.
