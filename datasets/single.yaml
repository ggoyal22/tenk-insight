- query: As of December 31, 2025, what were the three largest unions representing Boeing's
    workforce by percentage of total employees, and what was the expiration date of the IAM
    District 751 collective bargaining agreement covering Washington state manufacturing employees?
  query_type: single
  difficulty: hard
  answer: |
    As of December 31, 2025, the three largest unions were: the International Association of Machinists and Aerospace Workers (IAM) at 25% of total workforce; the Society of Professional Engineering Employees in Aerospace (SPEEA) at 11%; and the United Automobile, Aerospace and Agricultural Implement Workers of America (UAW) at 1%. The IAM District 751 agreement covering Washington state expires in September 2028.
