# Out-of-scope golden dataset.
#
# Covers distinct out-of-scope categories:
#   1. Ticker entirely absent from corpus (e.g. GOOGL, AMZN, INTC)
#   2. Real-time / post-filing market data (stock price)
#   3. Ticker in corpus but requested year not in any filing
#   4. Filing in corpus is a Part III amendment only (TSLA) — no financials
#   5. Information type inherently absent from 10-K filings
#      (analyst targets, forward guidance, per-unit pricing)
#   6. Completely irrelevant (non-financial) question
#   7. Data exists in a different SEC filing type (proxy/DEF 14A), not 10-K
#
# Answer field reflects the actual pipeline canned response:
#   - LLM classifies out_of_scope  -> "This question can't be answered from SEC 10-K filings."
#   - Ticker has no indexed filings -> "I don't have filings indexed for <TICKER>."
#   - Passes ticker check, retrieval returns nothing -> generate-node "no relevant info" response

