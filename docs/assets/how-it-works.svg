<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="How the system works: filings are ingested into a searchable library. Each question is planned, searched, checked, and answered with citations. Every run is recorded, and quality is scored against a fixed set of reference questions.">
  <defs>
    <marker id="aSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="aIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818CF8"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14B8A6"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="92" font-size="42" font-weight="700" fill="#0F172A">How it works</text>

    <!-- ═══════════ Lane 1: INGEST ═══════════ -->
    <rect x="60" y="140" width="500" height="880" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="100" y="196" font-size="26" font-weight="700" letter-spacing="2" fill="#64748B">INGEST<tspan font-weight="400" letter-spacing="0"> — once per filing</tspan></text>

    <rect x="100" y="240" width="420" height="130" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="310" y="297" font-size="30" font-weight="600" fill="#1E293B" text-anchor="middle">Company annual reports</text>
    <text x="310" y="337" font-size="22" fill="#64748B" text-anchor="middle">10-K filings from SEC EDGAR</text>

    <line x1="310" y1="376" x2="310" y2="508" stroke="#94A3B8" stroke-width="4" marker-end="url(#aSlate)"/>

    <!-- library cylinder -->
    <path d="M140 540 v110 a170 22 0 0 0 340 0 v-110" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <ellipse cx="310" cy="540" rx="170" ry="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="310" y="606" font-size="30" font-weight="600" fill="#1E293B" text-anchor="middle">Searchable library</text>
    <text x="310" y="642" font-size="22" fill="#64748B" text-anchor="middle">every filing read, split, indexed</text>

    <!-- ═══════════ Lane 2: ANSWER ═══════════ -->
    <rect x="620" y="140" width="760" height="880" rx="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="660" y="196" font-size="26" font-weight="700" letter-spacing="2" fill="#4F46E5">ANSWER</text>

    <rect x="700" y="240" width="500" height="100" rx="50" fill="#FFFFFF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
    <text x="950" y="284" font-size="30" font-weight="600" fill="#1E293B" text-anchor="middle">Your question</text>
    <text x="950" y="318" font-size="22" font-style="italic" fill="#64748B" text-anchor="middle">“How do two companies’ risks compare?”</text>

    <line x1="950" y1="346" x2="950" y2="377" stroke="#818CF8" stroke-width="4" marker-end="url(#aIndigo)"/>

    <rect x="700" y="385" width="500" height="110" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2" filter="url(#shadow)"/>
    <text x="950" y="434" font-size="30" font-weight="600" fill="#1E293B" text-anchor="middle">Plans what to look for</text>
    <text x="950" y="470" font-size="22" fill="#64748B" text-anchor="middle">breaks the question into searches</text>

    <line x1="950" y1="501" x2="950" y2="532" stroke="#818CF8" stroke-width="4" marker-end="url(#aIndigo)"/>

    <rect x="700" y="540" width="500" height="110" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2" filter="url(#shadow)"/>
    <text x="950" y="589" font-size="30" font-weight="600" fill="#1E293B" text-anchor="middle">Searches the filings</text>
    <text x="950" y="625" font-size="22" fill="#64748B" text-anchor="middle">finds the relevant passages</text>

    <line x1="950" y1="656" x2="950" y2="687" stroke="#818CF8" stroke-width="4" marker-end="url(#aIndigo)"/>

    <rect x="700" y="695" width="500" height="110" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2" filter="url(#shadow)"/>
    <text x="950" y="744" font-size="30" font-weight="600" fill="#1E293B" text-anchor="middle">Checks its own work</text>
    <text x="950" y="780" font-size="22" fill="#64748B" text-anchor="middle">enough to answer the question?</text>

    <line x1="950" y1="811" x2="950" y2="842" stroke="#818CF8" stroke-width="4" marker-end="url(#aIndigo)"/>

    <rect x="700" y="850" width="500" height="130" rx="65" fill="#4F46E5" filter="url(#shadow)"/>
    <text x="950" y="907" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="middle">Answer — with citations</text>
    <text x="950" y="945" font-size="22" fill="#C7D2FE" text-anchor="middle">every claim points back to the filing</text>

    <!-- the loop-back: what makes it agentic -->
    <path d="M1200 750 C1320 750 1320 595 1200 595" fill="none" stroke="#D97706" stroke-width="4" marker-end="url(#aAmber)"/>
    <rect x="1214" y="646" width="152" height="52" rx="26" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
    <text x="1290" y="679" font-size="21" font-weight="600" fill="#B45309" text-anchor="middle">search again</text>

    <!-- library feeds the search -->
    <line x1="480" y1="595" x2="692" y2="595" stroke="#94A3B8" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#aSlate)"/>

    <!-- ═══════════ Lane 3: MEASURE ═══════════ -->
    <rect x="1420" y="140" width="460" height="880" rx="20" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <text x="1460" y="196" font-size="26" font-weight="700" letter-spacing="2" fill="#0F766E">MEASURE</text>

    <rect x="1450" y="390" width="400" height="180" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2" filter="url(#shadow)"/>
    <text x="1650" y="434" font-size="25" font-weight="700" letter-spacing="3" fill="#0F766E" text-anchor="middle">TRACE</text>
    <text x="1650" y="484" font-size="29" font-weight="600" fill="#1E293B" text-anchor="middle">Every run is recorded</text>
    <text x="1650" y="520" font-size="21" fill="#64748B" text-anchor="middle">query, passages, tokens, time taken</text>

    <line x1="1650" y1="575" x2="1650" y2="642" stroke="#14B8A6" stroke-width="3.5" marker-end="url(#aTeal)"/>

    <rect x="1450" y="650" width="400" height="190" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2" filter="url(#shadow)"/>
    <text x="1650" y="694" font-size="25" font-weight="700" letter-spacing="3" fill="#0F766E" text-anchor="middle">EVALUATE</text>
    <text x="1650" y="744" font-size="29" font-weight="600" fill="#1E293B" text-anchor="middle">Quality is scored</text>
    <text x="1650" y="780" font-size="21" fill="#64748B" text-anchor="middle">against a fixed reference set,</text>
    <text x="1650" y="810" font-size="21" fill="#64748B" text-anchor="middle">after each change</text>

    <path d="M1200 915 H1378 Q1400 915 1400 893 V502 Q1400 480 1422 480 H1444" fill="none" stroke="#14B8A6" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#aTeal)"/>
  </g>
</svg>
