# =============================================================================
# SEC EDGAR RAG System — Application Configuration
# =============================================================================
# All tunable parameters live here. Environment-specific values (DB credentials,
# API keys) belong in .env — see .env.example for the full list.
# =============================================================================

# ── Database ──────────────────────────────────────────────────────────────────
database:
  engine: "postgres"              # postgres — credentials in .env


# ── Vector Store ──────────────────────────────────────────────────────────────
vector_store:
  engine: "pgvector"              # pgvector / pinecone / qdrant


# ── Data Sources ──────────────────────────────────────────────────────────────
edgar:
  tickers:                      # add or remove tickers here; combined with years below
    - "AAPL"
    - "AMD"
    - "BA"
    - "MSFT"
    - "NVDA"
    - "PFE"
    - "TSLA"
    - "XOM"
  form_types:
    - "10-K"                    # add 10-Q, 8-K, etc. here as needed
  years:                        # both years required: comparison goldens filter per fiscal_year
    - 2024
    - 2025
  raw_data_dir: "data/raw"      # relative path; resolved to absolute at runtime


# ── Embedding ─────────────────────────────────────────────────────────────────
embedding:
  model: "BAAI/bge-large-en-v1.5"
  dimension: 1024               # must match the chosen model's output dimension
  batch_size: 16                # number of chunks to embed per batch
  device: "cpu"                 # cpu / cuda / mps (Apple Silicon)


# ── Chunking ──────────────────────────────────────────────────────────────────
chunking:
  child_chunk_size: 256         # tokens — unit for vector retrieval
  child_chunk_overlap: 32       # tokens — overlap between consecutive child chunks
  parent_chunk_size: 1024       # tokens — unit for LLM context delivery
  parent_chunk_overlap: 64      # tokens — overlap between consecutive parent chunks


# ── Vector Index ──────────────────────────────────────────────────────────────
vector_index:
  type: "hnsw"                  # only supported type; hnsw is strictly better for RAG (no pre-training required)
  distance_function: "cosine"   # cosine / l2 / dot
  hnsw_m: 16                    # connectivity — higher = better recall, more memory
  hnsw_ef_construction: 64      # build-time search width — higher = better recall, slower build


# ── Retrieval ─────────────────────────────────────────────────────────────────
retrieval:
  metadata_filtering:
    enabled: true                # set false to disable all metadata pre-filtering (useful for evaluation)

  vector_search:
    enabled: true
    quantization: halfvec        # none | halfvec | scalar
    oversample_k: 40             # candidates fetched before float32 rescore
    # Similarity in [0, 1] — pgvector's <=> returns cosine DISTANCE; store converts: score = 1 - distance.
    similarity_threshold: 0.7

  keyword_search:
    enabled: true
    implementation: fts            # fts (PostgreSQL full-text search)
    top_k: 20
    fts:                           # only read when implementation: fts
      query_mode: web              # standard | phrase | web

  fusion:
    implementation: rrf          # reciprocal rank fusion
    rrf_k: 60                    # RRF constant — higher de-emphasises rank gaps
    top_k: 20                    # candidates passed to reranker

  reranking:
    enabled: true               # cross-encoder reranking of fused candidates; loads the model on startup
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_k: 5                     # final results returned to the LLM (only used when reranking.enabled: true)

  section_retry:                 # widen an over-narrow section filter by re-searching without it
    enabled: true                # set false to disable; requires reranking.enabled
    min_top_score: 3.0           # if the top reranked result scores below this, also search without
                                 # the section filter and merge (reranker-specific scale)

  final_top_k: 5                 # used when reranking is disabled


# ── LLM ───────────────────────────────────────────────────────────────────────
llm:
  provider: "openai"            # ollama | openai (base_url and api_key in .env)
  model: "gpt-4o-mini"
  temperature: 0.0              # 0.0 for deterministic, reproducible answers
  max_tokens: 2048
  timeout: 120                  # seconds before the request is abandoned


# ── Generation ────────────────────────────────────────────────────────────────
generation:
  hyde:
    enabled: false            # generate a hypothetical passage to improve vector retrieval
  hop:
    enabled: true               # enable iterative retrieval (check_hop node)
    max_hops: 1                  # max retrieval rounds before forcing an answer
  reflection:
    enabled: false               # re-evaluate answer quality and trigger extra retrieval if needed
    max_iterations: 2
  eval_stop_after: null          # stop after this node in eval runs; null = run to completion
                                 # valid values: analyze_query | hyde_expand | retrieve | check_hop | generate | reflect


# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: "INFO"                 # DEBUG / INFO / WARNING / ERROR


# ── Tracing ───────────────────────────────────────────────────────────────────
tracing:
  enabled: false                # set true to export traces (requires OTEL_EXPORTER_OTLP_ENDPOINT in .env)


# ── Prompts ───────────────────────────────────────────────────────────────────
prompts:
  source: local               # local | phoenix (phoenix falls back to local per-prompt if unavailable)
  tag:                          # Phoenix version tag to pull at startup (e.g. "production"); omit for latest


# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  extractor:
    backend: phoenix            # reads PHOENIX_DB_PATH from .env

  evaluator:
    backend: ragas
    judge_llm:
      provider: openai          # LLM used by RAGAS to score answers — independent of the pipeline LLM
      model: gpt-4o-mini

  metrics:
    - faithfulness
    - answer_correctness        # skipped automatically when golden_path is not set
    - context_precision
    - context_recall            # skipped automatically when golden_path is not set

  datasets:                     # query_type groups to evaluate; empty group → warning, not error
    - single
    - comparison
    - out_of_scope

  golden_path: datasets/     # path to a YAML file or directory with ground-truth Q&A pairs;
                             # enables reference-required metrics (context_recall, answer_correctness)


  results:
    phoenix_annotations: true   # write per-trace scores back to Phoenix as span annotations
    results_dir: data/eval_results  # aggregate run history written here as runs.jsonl

  log_level: INFO               # DEBUG / INFO / WARNING / ERROR
