# =============================================================================
# SEC EDGAR RAG System — Application Configuration
# =============================================================================
# All tunable parameters live here. Environment-specific values (DB credentials,
# API keys) belong in .env — see .env.example for the full list.
# =============================================================================

# ── Database ──────────────────────────────────────────────────────────────────
database:
  engine: "postgres"              # postgres — credentials in .env


# ── Vector Store ──────────────────────────────────────────────────────────────
vector_store:
  engine: "pgvector"              # pgvector / pinecone / qdrant


# ── Data Sources ──────────────────────────────────────────────────────────────
edgar:
  tickers:
    - "NVDA"                    # add more tickers here as needed
  form_types:
    - "10-K"                    # add 10-Q, 8-K, etc. here as needed
  years:
    - 2024                      # fiscal years to ingest; add more to backfill
  raw_data_dir: "data/raw"      # relative path; resolved to absolute at runtime


# ── Embedding ─────────────────────────────────────────────────────────────────
embedding:
  model: "BAAI/bge-large-en-v1.5"
  dimension: 1024               # must match the chosen model's output dimension
  batch_size: 64                # number of chunks to embed per batch
  device: "cpu"                 # cpu / cuda / mps (Apple Silicon)


# ── Chunking ──────────────────────────────────────────────────────────────────
chunking:
  child_chunk_size: 256         # tokens — unit for vector retrieval
  child_chunk_overlap: 32       # tokens — overlap between consecutive child chunks
  parent_chunk_size: 1024       # tokens — unit for LLM context delivery
  parent_chunk_overlap: 64      # tokens — overlap between consecutive parent chunks


# ── Vector Index ──────────────────────────────────────────────────────────────
vector_index:
  type: "hnsw"                  # only supported type; hnsw is strictly better for RAG (no pre-training required)
  distance_function: "cosine"   # cosine / l2 / dot
  hnsw_m: 16                    # connectivity — higher = better recall, more memory
  hnsw_ef_construction: 64      # build-time search width — higher = better recall, slower build


# ── Retrieval ─────────────────────────────────────────────────────────────────
retrieval:
  metadata_filtering:
    enabled: true                # set false to disable all metadata pre-filtering (useful for evaluation)

  vector_search:
    enabled: true
    quantization: halfvec        # none | halfvec | scalar
    oversample_k: 40             # candidates fetched before float32 rescore
    # Similarity in [0, 1] — pgvector's <=> returns cosine DISTANCE; store converts: score = 1 - distance.
    similarity_threshold: 0.0

  keyword_search:
    enabled: true
    implementation: fts            # fts | bm25 (bm25 not yet supported)
    top_k: 20
    fts:                           # only read when implementation: fts
      query_mode: web              # standard | phrase | web
    bm25:                          # only read when implementation: bm25
      k1: 1.5                      # term frequency saturation
      b: 0.75                      # document length normalisation

  fusion:
    implementation: rrf          # rrf (linear_combination future)
    rrf_k: 60                    # RRF constant — higher de-emphasises rank gaps
    top_k: 20                    # candidates passed to reranker

  reranking:
    enabled: false               # loads a large model on startup — enable explicitly when needed
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_k: 5                     # final results returned to the LLM (only used when reranking.enabled: true)

  final_top_k: 5                 # used when reranking is disabled


# ── LLM ───────────────────────────────────────────────────────────────────────
llm:
  provider: "openai"            # ollama | openai (base_url and api_key in .env)
  model: "gpt-4o-mini"
  temperature: 0.0              # 0.0 for deterministic, reproducible answers
  max_tokens: 2048
  timeout: 120                  # seconds before the request is abandoned


# ── Generation ────────────────────────────────────────────────────────────────
generation:
  hyde:
    enabled: true               # generate a hypothetical passage to improve vector retrieval
  reflection:
    enabled: true               # re-evaluate answer quality and trigger extra retrieval if needed
    max_iterations: 2
  multi_hop:
    max_hops: 3                 # max retrieval rounds before forcing an answer


# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: "INFO"                 # DEBUG / INFO / WARNING / ERROR
